<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo circular oscuro -->
  <circle cx="256" cy="256" r="256" fill="#0F172A"/>
  
  <!-- Borde fino de acento brillante -->
  <circle cx="256" cy="256" r="240" fill="none" stroke="#00E5FF" stroke-width="12" opacity="0.4"/>
  
  <!-- Letra T robusta en color Blanco -->
  <path d="M 130 140 H 382 V 210 H 296 V 380 H 216 V 210 H 130 Z" fill="#FFFFFF"/>
  
  <!-- Ranura de tornillo diagonal que cruza la T (Acento) -->
  <rect x="210" y="125" width="92" height="20" rx="10" transform="rotate(-30 256 135)" fill="#00E5FF"/>
</svg>
