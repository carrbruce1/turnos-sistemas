<div class="crear-usuario-container">
  <!-- Encabezado -->
  <div class="header">
    <button class="btn-volver" (click)="volverAlAdmin()" type="button">
      ← Volver al Panel
    </button>
    <h2>Crear Nuevo Usuario</h2>
  </div>

  <!-- Tarjeta del Formulario -->
  <div class="form-card">
    <form (ngSubmit)="registrarEmpleado()" #formUsuario="ngForm">
      <!-- Nombre Completo -->
      <div class="form-group">
        <label for="nombre">Nombre y Apellido</label>
        <input
          type="text"
          id="nombre"
          name="nombre"
          [(ngModel)]="nuevoUsuario.nombre"
          placeholder="Ej: Juan Pérez"
          required
        />
      </div>

      <!-- Correo Electrónico -->
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input
          type="email"
          id="email"
          name="email"
          [(ngModel)]="nuevoUsuario.email"
          placeholder="ejemplo@barberia.com"
          required
        />
      </div>

      <!-- Contraseña -->
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          type="password"
          id="password"
          name="password"
          [(ngModel)]="nuevoUsuario.password"
          placeholder="Mínimo 6 caracteres"
          required
        />
      </div>

      <!-- Rol del Usuario -->
      <div class="form-group">
        <label for="rol">Rol del Usuario</label>
        <select id="rol" name="rol" [(ngModel)]="nuevoUsuario.rol">
          <option value="empleado">Barbero / Empleado</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <!-- Botón Guardar -->
      <button
        type="submit"
        class="btn-guardar"
        [disabled]="cargando"
      >
        <span *ngIf="!cargando">Crear Usuario</span>
        <span *ngIf="cargando">Guardando...</span>
      </button>
    </form>
  </div>
</div>
